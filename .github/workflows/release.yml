name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync version with tag
        run: |
          TAG_VERSION=${GITHUB_REF_NAME#v}
          echo "Setting package.json version to $TAG_VERSION"
          npm version $TAG_VERSION --no-git-tag-version --allow-same-version

      - name: Build & Publish Linux AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run desktop:build
          npx electron-builder --linux --publish always -c.publish.releaseType=release
          gh release edit "$GITHUB_REF_NAME" --draft=false || true
