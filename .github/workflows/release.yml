name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync version with tag
        shell: bash
        run: |
          TAG_VERSION=${GITHUB_REF_NAME#v}
          echo "Setting package.json version to $TAG_VERSION"
          npm version $TAG_VERSION --no-git-tag-version --allow-same-version

      - name: Build & Publish Linux AppImage
        if: matrix.os == 'ubuntu-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run desktop:build
          npx electron-builder --linux --publish always -c.publish.releaseType=release
          gh release edit "$GITHUB_REF_NAME" --draft=false || true

      - name: Build & Publish Windows Installer
        if: matrix.os == 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          npm run desktop:build
          npx electron-builder --win --publish always -c.publish.releaseType=release
          gh release edit "$GITHUB_REF_NAME" --draft=false || true
