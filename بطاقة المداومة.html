body{padding:14px 0}

.bar button:hover{background:#eef3fa}
.fld{position:absolute;box-sizing:border-box;margin:0;padding:0 4px;white-space:nowrap;overflow:hidden;outline:none;
  direction:rtl;unicode-bidi:plaintext;text-align:right;font-size:13.92pt;line-height:1.2;color:#000;
  background:transparent;border-radius:2px;cursor:default}
.fld:hover{background:transparent}
.fld:focus{background:transparent}
@media print{

}

}

<script>
(function(){
  function fit(){
    var w=document.documentElement.clientWidth-16, pw=841.92*96/72;
    document.documentElement.style.setProperty('--fit', Math.min(1, w/pw));
  }
  fit(); window.addEventListener('resize',fit);
  window.addEventListener('beforeprint',function(){document.documentElement.style.setProperty('--fit',1);});
  window.addEventListener('afterprint',fit);
})();
</script>
<script>
(function(){
  var KEY='driving-card-v1';
  var DEMO={"school": "مدرسة النجاح لتعليم السياقة", "name": "أحمد بن يوسف", "birth": "12/05/2001 - البليدة", "address": "حي الأمل، شارع 5 جويلية، البليدة", "deposit": "17/10/2026", "fileno": "2026/0417", "cat": "B", "phone": "0550 12 34 56", "license": "123456789", "date": "17/10/2026"};
  var page=document.getElementById('page1');
  var fields=[].slice.call(document.querySelectorAll('.fld'));
  var st=null;
  try{st=JSON.parse(localStorage.getItem(KEY));}catch(e){}
  if(!st||typeof st!=='object'||!st.v){st={v:{}};}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
  function fit(el){
    el.style.fontSize='';
    var fs=parseFloat(getComputedStyle(el).fontSize),min=fs*0.6;
    while(el.scrollWidth>el.clientWidth+0.5&&fs>min){fs-=0.4;el.style.fontSize=fs+'px';}
  }
  function leader(el){
    var L=document.querySelector('[data-leader="'+el.getAttribute('data-key')+'"]');
    if(L)L.style.visibility=el.textContent.trim()?'hidden':'visible';
  }
  function render(){
    fields.forEach(function(el){
      var k=el.getAttribute('data-key');
      el.textContent=(k in st.v)?st.v[k]:DEMO[k];
      fit(el);leader(el);
    });
  }
  fields.forEach(function(el){
    var k=el.getAttribute('data-key');
    el.addEventListener('input',function(){st.v[k]=el.textContent;fit(el);leader(el);save();});
    el.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();el.blur();}});
    el.addEventListener('paste',function(e){
      e.preventDefault();
      var t=((e.clipboardData||window.clipboardData).getData('text')||'').replace(/\s+/g,' ');
      document.execCommand('insertText',false,t);
    });
  });
  document.getElementById('bPrint').addEventListener('click',function(){window.print();});
  document.getElementById('bDemo').addEventListener('click',function(){st.v={};save();render();});
  document.getElementById('bClear').addEventListener('click',function(){
    if(!confirm('Clear all fields?'))return;
    st={v:{}};fields.forEach(function(el){st.v[el.getAttribute('data-key')]='';});
    save();render();
  });
  render();
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(function(){fields.forEach(fit);});}
  window.addEventListener('beforeprint',function(){fields.forEach(fit);});
})();
</script>
